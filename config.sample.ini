; =====================================================================
; PlcMesBridge 现场配置样例（复制为 config\config.ini 后按现场改）
; 缺键启动时自动回填缺省（IniFile 自愈），本文件仅作对照与说明。
; 程序目录结构：exe 同目录 config\config.ini / config\mes_params.json /
;   DataBase\PLCdatabase.db3 / log\yyyy-MM-dd\log.txt /
;   Logs\MESLOG\MES_yyyy-MM-dd.txt（单机）或 yyyy-MM-dd\机台名.txt（多机）
; =====================================================================

[setting]
; 运行语言：CH 中文 / EN 英文（界面语言按钮切换后自动改这里）
Language=CH
; 运行模式：Single 单机固化收料 / Multi 多机通用网关
Mode=Single
; 联调开关：1=内存模拟 PLC（无真机跑通全流程），0=连真机
Simulate=1
; 单机 PLC 地址（二进制 MC，默认 192.168.1.80:6060 由程序内置，改这里不生效，
; 如需改单机 IP 请联系开发；多机 IP 走下面 PLCIP2~10）
; 多机启用开关（8 台，1=连接，0=跳过）
PLCuse=1,1,1,1,1,1,1,1
; 多机 PLC 地址（键名跳号是历史沿用：2..7,9,10 对应 0..7 号机；1/2/5 号走 ASCII 协议）
PLCIP2=192.168.1.10
PLCIP3=192.168.1.30
PLCIP4=192.168.1.40
PLCIP5=192.168.1.50
PLCIP6=192.168.1.60
PLCIP7=192.168.1.70
PLCIP9=192.168.1.90
PLCIP10=192.168.1.100
; MES 报警位（单机上传失败写 1 的地址）
MESPLCALarm=D30013

[MES]
; 6 个接口 URL
Url_API0027=http://192.168.120.129:5012/MacProduction/MacParameters
Url_API0028=http://192.168.120.129:5012/MacProduction/InsMachineDAQ
Url_API0030=http://192.168.120.129:5012/MacTraceability/BoardInOut
Url_API0031=http://192.168.120.129:5012/MacTraceability/Prelogcheck
Url_API0032=http://192.168.120.129:5012/MacTraceability/UploadMaterial
Url_API0033=http://192.168.120.129:5012/MacTraceability/UploadBadDetail
; 6 个触发字（多机模式 PLC 置 1 请求上传）
TriggerAddrAPI0027=R13000
TriggerAddrAPI0028=R16000
TriggerAddrAPI0030=R17000
TriggerAddrAPI0031=R18000
TriggerAddrAPI0032=R19000
TriggerAddrAPI0033=R12000
; PLC 内 JSON 最大字长
DataLength=799
; 6 组回写地址束（PLC数据 / MES回写MSG / MES回写DATA / MES回写STATUS / 完成标志）
API0027PLCDataAddr=R13001
API0027MESMSGAddr=R13810
API0027MESDataAddr=R13900
API0027MESSTATUSAddr=R13801
API0027MESCompleteAddr=R13800
API0028PLCDataAddr=R16001
API0028MESMSGAddr=R16810
API0028MESDataAddr=R16900
API0028MESSTATUSAddr=R16801
API0028MESCompleteAddr=R16800
API0030PLCDataAddr=R17001
API0030MESMSGAddr=R17810
API0030MESDataAddr=R17900
API0030MESSTATUSAddr=R17801
API0030MESCompleteAddr=R17800
API0031PLCDataAddr=R18001
API0031MESMSGAddr=R18810
API0031MESDataAddr=R18900
API0031MESSTATUSAddr=R18801
API0031MESCompleteAddr=R18800
